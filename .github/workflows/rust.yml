name: Rust

on:
  push:
    paths: 
    - "**.rs"
    - "Cargo.toml"
    - ".github/workflows/rust.yml"
  pull_request:
  workflow_call:

env:
    CARGO_TERM_COLOR: always

jobs:

  skip_check:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5.3.1
        with:
          concurrent_skipping: 'same_content_newer'

  channels:
    runs-on: ubuntu-latest
    outputs:
      strategy: ${{ steps.strategy.outputs.strategy }}
    steps:
    - uses: actions/checkout@v6.0.3
    - name: install jaq
      uses: taiki-e/install-action@v2.81.10
      with:
        tool: jaq
    - name: process strategy
      id: strategy
      run: echo "strategy=$(jaq -c .minimal .github/workflows/.config/matrix.yml)" >> $GITHUB_OUTPUT

  test:
    needs:
      - skip_check
      - channels
    if: needs.skip_check.outputs.should_skip != 'true'

    strategy: ${{ fromJson(needs.channels.outputs.strategy) }}
    env:
      RUSTC_BOOTSTRAP: ${{ matrix.bootstrap }}

    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6.0.3
    - run: rustup install --profile default ${{ matrix.channel }}
    - name: Run tests
      run: cargo +${{ matrix.channel }} test --no-fail-fast

  lint:
    needs:
      - skip_check
      - channels
    if: needs.skip_check.outputs.should_skip != 'true'

    strategy: ${{ fromJson(needs.channels.outputs.strategy) }}
    env:
      RUSTC_BOOTSTRAP: ${{ matrix.bootstrap }}

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6.0.3
    - run: rustup install --profile default ${{ matrix.channel }}
    - name: clippy
      run: cargo +${{ matrix.channel }} clippy -- --deny warnings

  fmt:
    needs: skip_check
    if: needs.skip_check.outputs.should_skip != 'true'

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6.0.3
    - name: fmt
      run: cargo fmt --check

  msrv:
    needs: skip_check
    if: needs.skip_check.outputs.should_skip != 'true'

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6.0.3
    - name: install cargo-msrv
      uses: taiki-e/install-action@v2.81.10
      with:
        tool: cargo-msrv
    - name: check MSRV
      run: cargo msrv verify

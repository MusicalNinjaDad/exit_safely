[package]
name = "exit_safely"
version = "0.3.1"
edition = "2024"
readme = "README.md"
description = "exit safely with custom exit codes while still calling `Drop` as needed. Aims for minimal magic and maximum flexibilty."
authors = ["Mike Foster <https://github.com/MusicalNinjaDad>"]
keywords = ["derive", "ExitCode", "Drop", "Termination", "CLI"]
homepage = "https://github.com/MusicalNinjaDad/exit_safely"
repository = "https://github.com/MusicalNinjaDad/exit_safely"
categories = ["development-tools", "rust-patterns"]
license = "MIT"
exclude = [".github", ".devcontainer"]
rust-version = "1.95.0"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0.117", features = ["extra-traits"] }
try_v2 = { workspace = true }
proc-macro2 = "1.0.106"
proc_macro2_diagnostic = "0.6.3"
quote = "1.0.45"

[dev-dependencies]
clap = { version = "4.6.1", default-features = false, features = ["std"] }
escargot = "0.5.15"
trybuild = "1.0.116"

[build-dependencies]
autocfg = { workspace = true }
ninja-build_rs = { workspace = true }

[workspace]
members = ["examples/*"]

[workspace.dependencies]
exit_safely = { path = "." }

autocfg = "1.5.1"
ninja-build_rs = "0.1.2"
try_v2 = "0.8.0"
